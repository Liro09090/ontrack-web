<!doctype html>
<html lang="ro">
<head>

<meta name="theme-color" content="#111214">
<title>OnTrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="tabs" id="tabs">

  <button data-tab="mancare"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 1-3 4-3 7h3v11"/></svg><span>Mâncare</span></button>

  <button data-tab="progres"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg><span>Progres</span></button>
  <button data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Profil</span></button>
</nav>
<div id="sheet" class="sheet" hidden></div>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="js/exercises.js"></script>
<script src="js/foods.js"></script>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
